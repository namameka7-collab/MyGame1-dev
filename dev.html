<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dark Tower — dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171a;
    --gold: #e8d8b0;
    --gold-dim: #b9ab84;
    --text: #e9e7e2;
    --text-dim: #cfcdc8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%; height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ===== ФОН ИГРЫ: тёмный лес, затемнённый для читаемости текста ===== */
  #bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url('assets/bg-forest.jpg') center center / cover no-repeat;
  }
  #bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(8,9,11,0.35), rgba(6,7,9,0.72) 72%),
      linear-gradient(180deg, rgba(6,7,9,0.55), rgba(6,7,9,0.62) 40%, rgba(6,7,9,0.72));
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  h2.page-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    color: var(--gold-dim);
    margin: 18px 0 0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }

  /* ===== ЭКРАН БОЯ ===== */
  #battle-demo-screen {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .battle-bars {
    padding: 10px 16px 4px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .bar-label {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    width: 34px;
    flex: 0 0 auto;
  }
  .bar-track {
    flex: 1;
    height: 9px;
    border-radius: 4px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(232,216,176,0.25);
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-fill.hp   { background: linear-gradient(90deg, #7a2020, #c0392b); }
  .bar-fill.armor{ background: linear-gradient(90deg, #38607a, #5a9bb8); }
  .bar-value {
    font-size: 11px;
    color: var(--text-dim);
    width: 52px;
    flex: 0 0 auto;
    text-align: right;
  }
  .unit-name {
    font-family: 'Cinzel', serif;
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--gold-dim);
    text-align: center;
    margin: 2px 0 4px;
  }

  .combat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
  }
  .combat-row.enemy-row { justify-content: flex-end; }
  .combat-row.player-row { justify-content: center; }

  #player-section { margin-top: auto; padding-bottom: 10px; }

  .player-skills-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 16px 4px;
  }

  .avatar-circle {
    width: 92px; height: 92px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    flex: 0 0 auto;
    overflow: hidden;
    position: relative;
  }
  .avatar-circle.player { background: radial-gradient(circle at 40% 30%, #4a1f22, #221011); border: 1.5px solid #c0392b; }
  .avatar-circle.enemy  { background: radial-gradient(circle at 40% 30%, #2a2438, #14111c); border: 1.5px solid #8a6fd0; }
  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  /* ===== АНИМАЦИИ БОЯ: аватары и эффекты ===== */
  .avatar-fx-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  /* полупрозрачная кровь, проступающая на аватаре при уроне */
  .blood-splat {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    z-index: 4;
  }
  .blood-splat::after {
    content: '';
    position: absolute;
    inset: -25%;
    background: url('assets/effect-blood.png') center / cover no-repeat;
    opacity: 0;
    mix-blend-mode: multiply;
  }
  .blood-splat.show::after { animation: bloodFade 1.3s ease forwards; }
  @keyframes bloodFade {
    0%   { opacity: 0;    transform: scale(0.75); }
    14%  { opacity: 0.85; transform: scale(1.06); }
    65%  { opacity: 0.5;  transform: scale(1); }
    100% { opacity: 0;    transform: scale(1); }
  }

  .fx-slot {
    position: absolute;
    inset: -55%;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .fx-slot img.fx-img {
    max-width: 200%;
    max-height: 200%;
    opacity: 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    animation: fxPop 0.7s ease forwards;
  }
  .fx-img.fx-bite { max-width: 130%; max-height: 130%; }
  .fx-img.fx-shield-break {
    max-width: 78%; max-height: 78%;
    filter: drop-shadow(0 0 10px #ff2b2b) brightness(1.15);
  }
  @keyframes fxPop {
    0%   { opacity: 0; transform: scale(0.55) rotate(-6deg); }
    28%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
    70%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(1.06) rotate(0deg); }
  }

  /* удар мечом: атакующий слегка подаётся вперёд */
  .avatar-circle.player.attack-lunge { animation: playerLunge 0.5s ease; }
  @keyframes playerLunge {
    0%   { transform: translateX(0); }
    35%  { transform: translateX(16px) scale(1.03); }
    100% { transform: translateX(0); }
  }
  /* волк атакует — тоже слегка подаётся вперёд, в сторону игрока */
  .avatar-circle.enemy.wolf-lunge { animation: wolfLunge 0.5s ease; }
  @keyframes wolfLunge {
    0%   { transform: translateX(0); }
    35%  { transform: translateX(-16px) scale(1.03); }
    100% { transform: translateX(0); }
  }
  /* получение удара: короткий откат назад + мгновенное покраснение */
  .avatar-circle.enemy.enemy-hit { animation: enemyRecoil 0.5s ease; }
  @keyframes enemyRecoil {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(-10px); }
    100% { transform: translateX(0); }
  }
  .avatar-circle.player.player-hit { animation: playerRecoil 0.5s ease; }
  @keyframes playerRecoil {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(10px); }
    100% { transform: translateX(0); }
  }
  .avatar-circle.enemy::after,
  .avatar-circle.player::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #ff2b2b;
    opacity: 0;
    pointer-events: none;
  }
  .avatar-circle.enemy.enemy-hit::after,
  .avatar-circle.player.player-hit::after {
    animation: redFlash 0.5s ease;
  }
  @keyframes redFlash {
    0%   { opacity: 0; }
    25%  { opacity: 0.6; }
    60%  { opacity: 0.28; }
    100% { opacity: 0; }
  }

  /* эффект поднятия щита — рисуется средствами CSS, без внешнего изображения */
  .fx-shield-raise {
    width: 62px; height: 72px;
    background: linear-gradient(180deg, #f2e6c4, #b9ab84 55%, #8a7c58);
    clip-path: polygon(50% 0%, 100% 18%, 100% 58%, 50% 100%, 0% 58%, 0% 18%);
    box-shadow: 0 0 18px 4px rgba(232,216,176,0.65);
    opacity: 0;
    animation: shieldPop 0.75s ease forwards;
  }
  @keyframes shieldPop {
    0%   { opacity: 0; transform: scale(0.4) translateY(6px); }
    30%  { opacity: 1; transform: scale(1.08) translateY(0); }
    75%  { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1.02) translateY(-4px); }
  }

  /* эффект удара когтями — рисуется средствами CSS, без внешнего изображения */
  .fx-claw-marks {
    width: 90px; height: 90px;
    position: relative;
    opacity: 0;
    animation: clawPop 0.6s ease forwards;
  }
  .fx-claw-marks span {
    position: absolute;
    top: -10%;
    width: 9%;
    height: 130%;
    background: linear-gradient(180deg, transparent, #c0392b 18%, #ff3b30 50%, #c0392b 82%, transparent);
    border-radius: 3px;
    transform: rotate(28deg);
  }
  .fx-claw-marks span:nth-child(1) { left: 18%; }
  .fx-claw-marks span:nth-child(2) { left: 38%; animation-delay: 0.04s; }
  .fx-claw-marks span:nth-child(3) { left: 58%; animation-delay: 0.08s; }
  .fx-claw-marks span:nth-child(4) { left: 78%; animation-delay: 0.12s; }
  @keyframes clawPop {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* критический удар — усиленная вспышка поверх обычного отката/покраснения */
  .avatar-circle.enemy.crit-hit::after { animation: critFlash 0.55s ease; }
  @keyframes critFlash {
    0%   { opacity: 0; }
    20%  { opacity: 0.9; }
    55%  { opacity: 0.4; }
    100% { opacity: 0; }
  }

  /* выстрел лучника — быстрая стрела-полоса, летящая к цели */
  .fx-arrow {
    position: absolute;
    top: 50%; left: 8%;
    width: 84%; height: 5px;
    background: linear-gradient(90deg, transparent, #e8d8b0 45%, #fff 80%, transparent);
    transform: translateY(-50%) scaleX(0);
    transform-origin: left center;
    opacity: 0;
    animation: arrowFly 0.42s ease forwards;
  }
  .fx-arrow::after {
    content: '';
    position: absolute;
    right: -2px; top: 50%;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 10px solid #fff;
    transform: translateY(-50%);
  }
  @keyframes arrowFly {
    0%   { opacity: 1; transform: translateY(-50%) scaleX(0); }
    55%  { opacity: 1; transform: translateY(-50%) scaleX(1); }
    100% { opacity: 0; transform: translateY(-50%) scaleX(1); }
  }

  /* уворот — размытый рывок в сторону */
  .avatar-circle.player.dash-evade { animation: dashEvade 0.45s ease; }
  @keyframes dashEvade {
    0%   { transform: translateX(0); filter: none; }
    30%  { transform: translateX(-18px); filter: blur(1.5px) brightness(1.2); }
    60%  { transform: translateX(10px); filter: blur(0.5px); }
    100% { transform: translateX(0); filter: none; }
  }
  .fx-evade-ring {
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 2px solid #7fd6e0;
    opacity: 0;
    animation: evadeRing 0.6s ease forwards;
  }
  @keyframes evadeRing {
    0%   { opacity: 0.9; transform: scale(0.6); }
    100% { opacity: 0;   transform: scale(1.5); }
  }

  /* самоисцеление — зелёное свечение и всплывающий «+N» */
  .fx-heal-glow {
    position: absolute; inset: -10%;
    border-radius: 50%;
    box-shadow: 0 0 22px 8px rgba(90,200,120,0.55);
    opacity: 0;
    animation: healGlow 0.9s ease forwards;
  }
  @keyframes healGlow {
    0%   { opacity: 0; }
    30%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .fx-heal-text {
    position: absolute;
    left: 50%; top: 45%;
    transform: translate(-50%, 0);
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    color: #8be6a0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    opacity: 0;
    animation: healFloat 1s ease forwards;
    white-space: nowrap;
  }
  @keyframes healFloat {
    0%   { opacity: 0; transform: translate(-50%, 0); }
    20%  { opacity: 1; transform: translate(-50%, -6px); }
    80%  { opacity: 1; transform: translate(-50%, -26px); }
    100% { opacity: 0; transform: translate(-50%, -34px); }
  }

  /* огненный шар — пульсирующий огненный сгусток */
  .fx-fireball {
    position: absolute; inset: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #fff3c0, #ff9d2e 40%, #c0392b 72%, transparent 78%);
    opacity: 0;
    animation: firePulse 0.65s ease forwards;
  }
  @keyframes firePulse {
    0%   { opacity: 0; transform: scale(0.4); }
    30%  { opacity: 1; transform: scale(1.1); }
    70%  { opacity: 0.85; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  /* цепь молний — зигзагообразный разряд */
  .fx-lightning {
    position: absolute;
    top: 6%; left: 42%;
    width: 16%; height: 88%;
    opacity: 0;
    animation: lightningFlicker 0.5s steps(1, end) forwards;
  }
  .fx-lightning svg { width: 100%; height: 100%; display: block; }
  @keyframes lightningFlicker {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    35%  { opacity: 0.2; }
    50%  { opacity: 1; }
    75%  { opacity: 0.3; }
    100% { opacity: 0; }
  }

  /* магический щит — как обычный щит, но в холодных магических тонах со свечением */
  .fx-shield-raise.magic {
    background: linear-gradient(180deg, #cfe0f5, #7e9fd0 55%, #4c5f96);
    box-shadow: 0 0 20px 6px rgba(140,170,240,0.7);
  }

  /* всплеск урона-отдачи от магического щита */
  .fx-reflect-burst {
    position: absolute; inset: 10%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,160,255,0.85), rgba(140,110,230,0.4) 55%, transparent 75%);
    opacity: 0;
    animation: firePulse 0.5s ease forwards;
  }

  .skill-icon {
    width: 54px; height: 54px;
    border-radius: 8px;
    border: 1px solid var(--gold-dim);
    background: rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transition: opacity 0.2s ease;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .skill-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }
  .skill-icon.interactive { cursor: pointer; }
  .skill-icon.interactive:active { border-color: var(--gold); }
  .skill-icon.on-cd { opacity: 1; }
  .skill-icon.on-cd img { opacity: 0.35; }
  .skill-icon .cd-badge {
    position: absolute;
    inset: 0;
    background: rgba(8,7,6,0.62);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .demo-dialogue {
    flex: 0 0 auto;
    min-height: 60px;
    margin: 8px 16px;
    background: rgba(20,19,18,0.55);
    border: 1px solid rgba(232,216,176,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
  }
  .demo-dialogue p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
  }
  .demo-dialogue .dmg { color: #e07a6b; font-weight: 600; }
  .demo-dialogue .bleed { color: #8fbf7a; font-weight: 600; }
  .demo-dialogue .stun { color: #e0b95a; font-weight: 600; }

  /* ===== ВСПЛЫВАЮЩЕЕ ОПИСАНИЕ СКИЛЛА (долгое нажатие) ===== */
  .skill-tooltip-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 30px;
    background: rgba(0,0,0,0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .skill-tooltip-overlay.show { opacity: 1; }
  .skill-tooltip-card {
    max-width: 320px;
    background: rgba(20,19,18,0.88);
    border: 1px solid rgba(232,216,176,0.45);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  }
  .skill-tooltip-card .tt-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 8px;
    text-align: center;
  }
  .skill-tooltip-card .tt-desc {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text-dim);
    text-align: center;
  }
  .skill-tooltip-card .tt-cd {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(232,216,176,0.25);
    font-size: 13px;
    color: var(--gold-dim);
  }
  .skill-tooltip-card .tt-cd .tt-clock { font-size: 14px; }
  .skill-tooltip-card .tt-cd b { color: var(--gold); font-weight: 700; }
</style>
</head>
<body>

<div id="bg-layer"></div>
<div id="app">

  <!-- ===== СЦЕНА БОЯ ===== -->
  <section id="battle-demo-screen">
    <h2 class="page-title">Бой</h2>

    <!-- полоски врага -->
    <div class="battle-bars">
      <div class="unit-name">Одичавший волк</div>
      <div class="bar-row">
        <span class="bar-label">ХП</span>
        <div class="bar-track"><div class="bar-fill hp" id="wolf-hp-fill" style="width:100%"></div></div>
        <span class="bar-value" id="wolf-hp-value">25 / 25</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Броня</span>
        <div class="bar-track"><div class="bar-fill armor" id="wolf-armor-fill" style="width:0%"></div></div>
        <span class="bar-value" id="wolf-armor-value">0 / 10</span>
      </div>
    </div>

    <!-- ряд врага: скиллы слева, аватар справа -->
    <div class="combat-row enemy-row" id="enemy-skill-row">
      <div class="skill-icon">
        <img src="assets/skill-claw.webp" onerror="this.onerror=null;this.src='assets/skill-claw.png';" alt="Когти">
      </div>
      <div class="skill-icon">
        <img src="assets/skill-bite.webp" onerror="this.onerror=null;this.src='assets/skill-bite.png';" alt="Укус">
      </div>
      <div class="avatar-fx-wrap" id="enemy-avatar-wrap">
        <div class="avatar-circle enemy">
          <img src="assets/wolf-avatar.webp" onerror="this.onerror=null;this.src='assets/wolf-avatar.png';" alt="Одичавший волк">
        </div>
        <div class="blood-splat" id="enemy-blood-splat"></div>
        <div class="fx-slot" id="enemy-fx-slot"></div>
      </div>
    </div>

    <!-- диалог боя -->
    <div class="demo-dialogue">
      <p id="battle-dialogue-text">Волк напряжённо следит за тобой. Выбери скилл, чтобы начать бой.</p>
    </div>

    <!-- секция игрока: прижата к низу экрана -->
    <div id="player-section">
      <!-- ряд игрока: аватар по центру -->
      <div class="combat-row player-row">
        <div class="avatar-fx-wrap" id="player-avatar-wrap">
          <div class="avatar-circle player" id="player-avatar">⚔️</div>
          <div class="blood-splat" id="player-blood-splat"></div>
          <div class="fx-slot" id="player-fx-slot"></div>
        </div>
      </div>

      <!-- полоски игрока -->
      <div class="battle-bars">
        <div class="unit-name" id="player-name-label">Герой</div>
        <div class="bar-row">
          <span class="bar-label">ХП</span>
          <div class="bar-track"><div class="bar-fill hp" id="player-hp-fill" style="width:100%"></div></div>
          <span class="bar-value" id="player-hp-value">100 / 100</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">Броня</span>
          <div class="bar-track"><div class="bar-fill armor" id="player-armor-fill" style="width:0%"></div></div>
          <span class="bar-value" id="player-armor-value">0 / 20</span>
        </div>
      </div>

      <!-- скиллы игрока — отдельным рядом под полоской ХП, до 5 штук -->
      <div class="player-skills-row" id="player-skill-row"></div>
    </div>
  </section>

  <!-- всплывающее описание скилла (долгое нажатие) -->
  <div class="skill-tooltip-overlay" id="skill-tooltip-overlay">
    <div class="skill-tooltip-card">
      <div class="tt-name" id="skill-tooltip-name"></div>
      <div class="tt-desc" id="skill-tooltip-desc"></div>
      <div class="tt-cd"><span class="tt-clock">🕐</span><b id="skill-tooltip-cd"></b></div>
    </div>
  </div>

</div>

<script>
  // ===== ГЕРОЙ ДЛЯ ЭТОЙ СЦЕНЫ =====
  // раньше выбирался на отдельном экране — сейчас просто фиксирован здесь.
  // чтобы проверить другого героя, поменяй 'knight' на 'archer' или 'wizard'.
  var DEFAULT_HERO_ID = 'knight';

  // данные для боя: иконки-плейсхолдеры (эмодзи) и, где есть, реальные ассеты
  var heroBattleData = {
    knight: {
      name: 'Рыцарь Палма',
      avatarIcon: '⚔️',
      avatarImg: 'assets/knight-avatar',
      skills: [
        { icon: '⚔️', img: 'assets/skill-power-strike', name: 'Яростный удар', desc: 'Атакует цель, урон от 5 до 20. Шанс 25% наложить кровотечение на 3 хода.', cd: 2, remainingCd: 0, dmgMin: 5, dmgMax: 20, bleedChance: 0.25, bleedTurns: 3, fx: 'slash' },
        { icon: '🛡️', img: 'assets/skill-shield-block', name: 'Поднять щит', desc: 'Даёт 15 единиц брони.', cd: 2, remainingCd: 0, armor: 15, fx: 'shieldRaise' },
        { icon: '🛡️', img: 'assets/skill-armor-stance', name: 'Удар щитом', desc: 'Наносит урон цели от 5 до 15 единиц. Шанс 30% оглушить врага на один ход.', cd: 2, remainingCd: 0, dmgMin: 5, dmgMax: 15, stunChance: 0.3, stunTurns: 1, fx: 'slash' }
      ]
    },
    archer: {
      name: 'Страж леса',
      avatarIcon: '🏹',
      avatarImg: 'assets/archer-avatar',
      skills: [
        { icon: '🏹', img: 'assets/skill-aimed-shot', name: 'Меткий выстрел', desc: 'Точный выстрел, урон от 4 до 14. Шанс 25% нанести критический удар — двойной урон.', cd: 2, remainingCd: 0, dmgMin: 4, dmgMax: 14, critChance: 0.25, critMult: 2, fx: 'shot' },
        { icon: '💨', img: 'assets/skill-evasion', name: 'Уворот', desc: 'На 3 хода даёт 30% шанс полностью увернуться от атаки противника.', cd: 5, remainingCd: 0, dodgeChance: 0.3, dodgeTurns: 3, fx: 'evade' },
        { icon: '❤️', img: 'assets/skill-self-heal', name: 'Самоисцеление', desc: 'Восстанавливает 10% максимального здоровья.', cd: 6, remainingCd: 0, healPct: 0.10, fx: 'heal' }
      ]
    },
    wizard: {
      name: 'Ведьмак отшельник',
      avatarIcon: '🔮',
      avatarImg: 'assets/wizard-avatar',
      skills: [
        { icon: '🔥', img: 'assets/skill-fireball', name: 'Огненный шар', desc: 'Наносит от 5 до 14 урона. Шанс 20% полностью отключить броню противника на 2 хода.', cd: 2, remainingCd: 0, dmgMin: 5, dmgMax: 14, disableArmorChance: 0.2, disableArmorTurns: 2, fx: 'fire' },
        { icon: '⚡', img: 'assets/skill-chain-lightning', name: 'Цепь молний', desc: 'Бьёт цель на 4–10 урона. Шанс 30% на второй разряд по той же цели, наносящий 7–16 урона.', cd: 3, remainingCd: 0, dmgMin: 4, dmgMax: 10, chainChance: 0.3, chainDmgMin: 7, chainDmgMax: 16, fx: 'chain' },
        { icon: '🔮', img: 'assets/skill-magic-shield', name: 'Магический щит', desc: 'Даёт 12 единиц брони. Если противник одним ударом полностью пробивает этот щит, он получает урон в размере 5% от собственной атаки.', cd: 3, remainingCd: 0, armor: 12, reflectPct: 0.05, fx: 'magicShield' }
      ]
    }
  };

  var chosenHero = { id: DEFAULT_HERO_ID, name: heroBattleData[DEFAULT_HERO_ID].name };

  // первый противник — одичавший волк (реальные ассеты)
  var wolfBattleData = {
    name: 'Одичавший волк',
    avatarIcon: '🐺',
    avatarImg: 'assets/wolf-avatar',
    skills: [
      { icon: '🐾', img: 'assets/skill-claw', name: 'Удар когтями', desc: 'Наносит от 3 до 10 урона и полностью отключает щит противника на 2 хода — все это время броня не защищает и её нельзя поднять. Затем защита противника восстанавливается.', cd: 2, remainingCd: 0, dmgMin: 3, dmgMax: 10, disableShieldTurns: 2, fx: 'claw' },
      { icon: '😾', img: 'assets/skill-bite', name: 'Укус', desc: 'Наносит от 3 до 15 урона и накладывает на противника кровотечение на 2 хода.', cd: 2, remainingCd: 0, dmgMin: 3, dmgMax: 15, bleedTurns: 2, fx: 'bite' }
    ]
  };

  // ===== СОСТОЯНИЕ БОЯ =====
  var wolfState = { hp: 25, maxHp: 25, armor: 0, maxArmor: 10, bleedTurns: 0, bleedDmg: 3, stunTurns: 0, armorDisabledTurns: 0, alive: true };
  var playerState = { hp: 100, maxHp: 100, armor: 0, maxArmor: 20, bleedTurns: 0, bleedDmg: 3, shieldDisabledTurns: 0, dodgeChance: 0, dodgeTurns: 0, magicShieldReflectPct: 0, alive: true };
  var battleBusy = false;
  var lastPlayerReflect = 0;

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function setDialogue(html) {
    document.getElementById('battle-dialogue-text').innerHTML = html;
  }

  function renderWolfBars() {
    var hpPct = Math.round(wolfState.hp / wolfState.maxHp * 100);
    var armorPct = Math.round(wolfState.armor / wolfState.maxArmor * 100);
    document.getElementById('wolf-hp-fill').style.width = hpPct + '%';
    document.getElementById('wolf-hp-value').textContent = wolfState.hp + ' / ' + wolfState.maxHp;
    document.getElementById('wolf-armor-fill').style.width = armorPct + '%';
    document.getElementById('wolf-armor-value').textContent = wolfState.armor + ' / ' + wolfState.maxArmor;
  }

  function renderPlayerBars() {
    var hpPct = Math.round(playerState.hp / playerState.maxHp * 100);
    document.getElementById('player-hp-fill').style.width = hpPct + '%';
    document.getElementById('player-hp-value').textContent = playerState.hp + ' / ' + playerState.maxHp;
    var armorPct = Math.round(playerState.armor / playerState.maxArmor * 100);
    document.getElementById('player-armor-fill').style.width = armorPct + '%';
    document.getElementById('player-armor-value').textContent = playerState.armor + ' / ' + playerState.maxArmor;
  }

  // урон по волку: сначала гасится бронёй (если не отключена), потом снимается ХП.
  function damageWolf(amount, ignoreArmor) {
    if (!wolfState.alive) return 0;
    var beforeHp = wolfState.hp;
    var dmg = amount;
    if (!ignoreArmor && wolfState.armor > 0 && wolfState.armorDisabledTurns === 0) {
      var absorbed = Math.min(wolfState.armor, dmg);
      wolfState.armor -= absorbed;
      dmg -= absorbed;
    }
    wolfState.hp = Math.max(0, wolfState.hp - dmg);
    if (wolfState.hp <= 0) wolfState.alive = false;
    renderWolfBars();
    if (wolfState.hp < beforeHp) spawnBlood('enemy-blood-splat');
    return amount;
  }

  // урон по игроку: сначала гасится бронёй (если щит не отключён), потом снимается ХП.
  // если броня получена от «Магического щита» и именно этим ударом пробита полностью — атакующий получает урон-отдачу.
  function damagePlayer(amount, ignoreArmor) {
    lastPlayerReflect = 0;
    if (!playerState.alive) return 0;
    var beforeHp = playerState.hp;
    var hadArmor = playerState.armor;
    var dmg = amount;
    if (!ignoreArmor && playerState.armor > 0 && playerState.shieldDisabledTurns === 0) {
      var absorbed = Math.min(playerState.armor, dmg);
      playerState.armor -= absorbed;
      dmg -= absorbed;
    }
    var shieldJustBroke = !ignoreArmor && hadArmor > 0 && playerState.armor === 0;
    playerState.hp = Math.max(0, playerState.hp - dmg);
    if (playerState.hp <= 0) playerState.alive = false;
    renderPlayerBars();
    if (playerState.hp < beforeHp) spawnBlood('player-blood-splat');
    if (shieldJustBroke && playerState.magicShieldReflectPct > 0) {
      lastPlayerReflect = Math.max(1, Math.round(amount * playerState.magicShieldReflectPct));
      playerState.magicShieldReflectPct = 0;
      damageWolf(lastPlayerReflect, true);
    }
    return amount;
  }

  // показывает полупрозрачное пятно крови на аватаре и убирает его через мгновение
  function spawnBlood(splatId) {
    var el = document.getElementById(splatId);
    if (!el) return;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1350);
  }

  function renderSkillBadges() {
    if (!chosenHero) return;
    var data = heroBattleData[chosenHero.id];
    var row = document.getElementById('player-skill-row');
    data.skills.forEach(function (s, i) {
      var box = row.querySelector('.skill-icon[data-idx="' + i + '"]');
      if (!box) return;
      var badge = box.querySelector('.cd-badge');
      var shieldBlocked = !!s.armor && playerState.shieldDisabledTurns > 0;
      if (s.remainingCd > 0 || shieldBlocked) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'cd-badge';
          box.appendChild(badge);
        }
        badge.textContent = shieldBlocked ? '✕' : s.remainingCd;
        box.classList.add('on-cd');
      } else {
        if (badge) badge.remove();
        box.classList.remove('on-cd');
      }
    });
  }

  function renderEnemySkillBadges() {
    var row = document.getElementById('enemy-skill-row');
    wolfBattleData.skills.forEach(function (s, i) {
      var box = row.querySelector('.skill-icon[data-enemy-idx="' + i + '"]');
      if (!box) return;
      var badge = box.querySelector('.cd-badge');
      if (s.remainingCd > 0) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'cd-badge';
          box.appendChild(badge);
        }
        badge.textContent = s.remainingCd;
        box.classList.add('on-cd');
      } else {
        if (badge) badge.remove();
        box.classList.remove('on-cd');
      }
    });
  }

  function tickCooldowns() {
    if (!chosenHero) return;
    var data = heroBattleData[chosenHero.id];
    data.skills.forEach(function (s) {
      if (s.remainingCd > 0) s.remainingCd--;
    });
    renderSkillBadges();
  }

  function tickWolfCooldowns() {
    wolfBattleData.skills.forEach(function (s) {
      if (s.remainingCd > 0) s.remainingCd--;
    });
    renderEnemySkillBadges();
  }

  function showSkillTooltip(skill) {
    document.getElementById('skill-tooltip-name').textContent = skill.name;
    document.getElementById('skill-tooltip-desc').textContent = skill.desc;
    document.getElementById('skill-tooltip-cd').textContent = skill.cd + (skill.cd === 1 ? ' ход' : (skill.cd < 5 ? ' хода' : ' ходов'));
    document.getElementById('skill-tooltip-overlay').classList.add('show');
  }

  function hideSkillTooltip() {
    document.getElementById('skill-tooltip-overlay').classList.remove('show');
  }

  // долгое нажатие — показать описание, короткое — применить скилл
  function attachSkillInteractions(box, skill) {
    box.classList.add('interactive');
    box.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    var pressTimer = null;
    var longPressed = false;
    function startPress(e) {
      e.preventDefault();
      longPressed = false;
      pressTimer = setTimeout(function () {
        longPressed = true;
        showSkillTooltip(skill);
      }, 450);
    }
    function endPress() {
      clearTimeout(pressTimer);
      var wasLong = longPressed;
      hideSkillTooltip();
      if (!wasLong) useSkill(skill);
    }
    function cancelPress() {
      clearTimeout(pressTimer);
      hideSkillTooltip();
    }
    box.addEventListener('pointerdown', startPress);
    box.addEventListener('pointerup', endPress);
    box.addEventListener('pointerleave', cancelPress);
    box.addEventListener('pointercancel', cancelPress);
  }

  // для скиллов волка: долгое нажатие показывает описание, короткое ничего не делает — это скиллы противника
  function attachEnemySkillTooltip(box, skill) {
    box.classList.add('interactive');
    box.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    var pressTimer = null;
    function startPress(e) {
      e.preventDefault();
      pressTimer = setTimeout(function () { showSkillTooltip(skill); }, 450);
    }
    function endPress() {
      clearTimeout(pressTimer);
      hideSkillTooltip();
    }
    box.addEventListener('pointerdown', startPress);
    box.addEventListener('pointerup', endPress);
    box.addEventListener('pointerleave', endPress);
    box.addEventListener('pointercancel', endPress);
  }

  // ===== АНИМАЦИИ И ЭФФЕКТЫ БОЯ =====
  function spawnImgFx(slotId, src, cls) {
    var slot = document.getElementById(slotId);
    if (!slot) return;
    var img = document.createElement('img');
    img.src = src;
    img.className = 'fx-img' + (cls ? ' ' + cls : '');
    slot.appendChild(img);
    setTimeout(function () { if (img.parentNode) img.remove(); }, 750);
  }

  function spawnShieldFx(cls) {
    var slot = document.getElementById('player-fx-slot');
    if (!slot) return;
    var div = document.createElement('div');
    div.className = 'fx-shield-raise' + (cls ? ' ' + cls : '');
    slot.appendChild(div);
    setTimeout(function () { if (div.parentNode) div.remove(); }, 800);
  }

  function spawnClawFx() {
    var slot = document.getElementById('player-fx-slot');
    if (!slot) return;
    var div = document.createElement('div');
    div.className = 'fx-claw-marks';
    div.innerHTML = '<span></span><span></span><span></span><span></span>';
    slot.appendChild(div);
    setTimeout(function () { if (div.parentNode) div.remove(); }, 700);
  }

  // общий помощник: кладёт div с заданным классом в fx-slot и убирает его через duration мс
  function spawnFxDiv(slotId, cls, duration, innerHTML) {
    var slot = document.getElementById(slotId);
    if (!slot) return;
    var div = document.createElement('div');
    div.className = cls;
    if (innerHTML) div.innerHTML = innerHTML;
    slot.appendChild(div);
    setTimeout(function () { if (div.parentNode) div.remove(); }, duration || 700);
  }

  // выстрел лучника — стрела летит от игрока к волку
  function spawnArrowFx() {
    spawnFxDiv('enemy-fx-slot', 'fx-arrow', 450);
  }

  // уворот — кольцо на игроке в момент активации
  function spawnEvadeRingFx() {
    spawnFxDiv('player-fx-slot', 'fx-evade-ring', 650);
  }

  // самоисцеление — зелёное свечение и всплывающий текст с числом
  function spawnHealFx(amount) {
    spawnFxDiv('player-fx-slot', 'fx-heal-glow', 950);
    spawnFxDiv('player-fx-slot', 'fx-heal-text', 1050, '+' + amount);
  }

  // огненный шар волка встречает удар
  function spawnFireFx() {
    spawnFxDiv('enemy-fx-slot', 'fx-fireball', 700);
  }

  // цепь молний — зигзаг молнии на цели
  var lightningSvg = '<svg viewBox="0 0 40 200" preserveAspectRatio="none"><polyline points="28,0 8,80 22,86 4,200 34,96 18,90 36,10" fill="none" stroke="#bfe8ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  function spawnChainFx() {
    spawnFxDiv('enemy-fx-slot', 'fx-lightning', 550, lightningSvg);
  }

  // урон-отдача от магического щита — вспышка на волке
  function spawnReflectFx() {
    spawnFxDiv('enemy-fx-slot', 'fx-reflect-burst', 550);
  }

  function playAvatarAnim(el, cls, duration) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, duration || 550);
  }

  function playerAttackAnim() {
    playAvatarAnim(document.getElementById('player-avatar'), 'attack-lunge');
  }
  function enemyHitAnim(crit) {
    var wrap = document.getElementById('enemy-avatar-wrap');
    if (!wrap) return;
    var el = wrap.querySelector('.avatar-circle.enemy');
    playAvatarAnim(el, 'enemy-hit');
    if (crit) playAvatarAnim(el, 'crit-hit');
  }
  function wolfAttackAnim() {
    var wrap = document.getElementById('enemy-avatar-wrap');
    if (wrap) playAvatarAnim(wrap.querySelector('.avatar-circle.enemy'), 'wolf-lunge');
  }
  function playerHitAnim() {
    playAvatarAnim(document.getElementById('player-avatar'), 'player-hit');
  }
  function playerDashEvadeAnim() {
    playAvatarAnim(document.getElementById('player-avatar'), 'dash-evade');
  }

  function useSkill(skill) {
    if (battleBusy || !wolfState.alive || !playerState.alive) return;
    if (skill.remainingCd > 0) return;
    if (skill.armor && playerState.shieldDisabledTurns > 0) return;
    battleBusy = true;

    var heroLabel = chosenHero ? chosenHero.name : 'Герой';
    var parts = [];

    if (skill.dmgMin != null) {
      var dmg = randInt(skill.dmgMin, skill.dmgMax);
      var isCrit = !!(skill.critChance && Math.random() < skill.critChance);
      if (isCrit) dmg = Math.round(dmg * (skill.critMult || 2));
      var dealt = damageWolf(dmg);
      parts.push(heroLabel + ' использует «' + skill.name + '»: волк получает <span class="dmg">' + dealt + ' урона</span>' + (isCrit ? ' — <span class="stun">критический удар!</span>' : '') + '.');

      if (wolfState.alive && skill.bleedChance && Math.random() < skill.bleedChance) {
        wolfState.bleedTurns = skill.bleedTurns;
        parts.push('<span class="bleed">Кровотечение: ' + skill.bleedTurns + ' хода.</span>');
      }
      if (wolfState.alive && skill.stunChance && Math.random() < skill.stunChance) {
        wolfState.stunTurns = skill.stunTurns;
        parts.push('<span class="stun">Волк оглушён на ' + skill.stunTurns + ' ход.</span>');
      }
      if (wolfState.alive && skill.disableArmorChance && Math.random() < skill.disableArmorChance) {
        wolfState.armor = 0;
        wolfState.armorDisabledTurns = skill.disableArmorTurns;
        parts.push('<span class="stun">Броня волка отключена на ' + skill.disableArmorTurns + ' хода.</span>');
      }

      var didChain = false;
      if (wolfState.alive && skill.chainChance && Math.random() < skill.chainChance) {
        didChain = true;
        var chainDmg = randInt(skill.chainDmgMin, skill.chainDmgMax);
        var chainDealt = damageWolf(chainDmg);
        parts.push('Молния бьёт снова: волк получает ещё <span class="dmg">' + chainDealt + ' урона</span>.');
      }

      // анимация атаки: игрок подаётся вперёд, летит эффект скилла, волк откатывается и краснеет
      playerAttackAnim();
      setTimeout(function () {
        if (skill.fx === 'slash') spawnImgFx('enemy-fx-slot', 'assets/effect-sword-slash.png', 'fx-slash');
        else if (skill.fx === 'shot') spawnArrowFx();
        else if (skill.fx === 'fire') spawnFireFx();
        else if (skill.fx === 'chain') spawnChainFx();
        enemyHitAnim(isCrit);
        if (didChain) {
          setTimeout(function () { spawnChainFx(); enemyHitAnim(false); }, 260);
        }
      }, 140);

    } else if (skill.armor) {
      playerState.armor = Math.min(playerState.maxArmor, playerState.armor + skill.armor);
      if (skill.reflectPct) playerState.magicShieldReflectPct = skill.reflectPct;
      renderPlayerBars();
      parts.push(heroLabel + ' использует «' + skill.name + '» и получает <span class="bleed">+' + skill.armor + ' брони</span>.');
      spawnShieldFx(skill.fx === 'magicShield' ? 'magic' : '');

    } else if (skill.dodgeChance) {
      playerState.dodgeChance = skill.dodgeChance;
      playerState.dodgeTurns = skill.dodgeTurns;
      parts.push(heroLabel + ' использует «' + skill.name + '»: ' + Math.round(skill.dodgeChance * 100) + '% шанс увернуться от атаки в течение ' + skill.dodgeTurns + ' ходов.');
      playerDashEvadeAnim();
      spawnEvadeRingFx();

    } else if (skill.healPct) {
      var healAmt = Math.round(playerState.maxHp * skill.healPct);
      playerState.hp = Math.min(playerState.maxHp, playerState.hp + healAmt);
      renderPlayerBars();
      parts.push(heroLabel + ' использует «' + skill.name + '» и восстанавливает <span class="bleed">' + healAmt + ' HP</span>.');
      spawnHealFx(healAmt);
    }

    skill.remainingCd = skill.cd;
    renderSkillBadges();
    setDialogue(parts.join(' '));

    if (!wolfState.alive) {
      setTimeout(function () {
        setDialogue('Волк повержен.');
        battleBusy = false;
      }, 800);
      return;
    }

    setTimeout(enemyTurn, 900);
  }

  function enemyTurn() {
    var lines = [];
    var heroLabel = chosenHero ? chosenHero.name : 'Герой';

    // кровотечение, наложенное игроком, тикает в начале хода волка
    if (wolfState.bleedTurns > 0) {
      var bleedDmg = damageWolf(wolfState.bleedDmg, true);
      wolfState.bleedTurns--;
      lines.push('Кровотечение: волк теряет <span class="dmg">' + bleedDmg + ' HP</span>.');
      if (!wolfState.alive) {
        lines.push('Волк истекает кровью и погибает.');
        setDialogue(lines.join(' '));
        battleBusy = false;
        return;
      }
    }

    if (wolfState.stunTurns > 0) {
      wolfState.stunTurns--;
      lines.push('Волк оглушён и не может действовать.');
      finishEnemyTurn(lines);
      return;
    }

    var wolfSkill = pickWolfSkill();
    if (!wolfSkill) {
      lines.push('Волк рычит, но все его атаки ещё не готовы.');
      finishEnemyTurn(lines);
      return;
    }

    // уворот: шанс полностью избежать атаки волка
    if (playerState.dodgeTurns > 0 && Math.random() < playerState.dodgeChance) {
      wolfSkill.remainingCd = wolfSkill.cd;
      lines.push('Волк использует «' + wolfSkill.name + '», но ' + heroLabel + ' уворачивается — атака проходит мимо!');
      wolfAttackAnim();
      setTimeout(function () { playerDashEvadeAnim(); }, 140);
      finishEnemyTurn(lines);
      return;
    }

    var dealt = damagePlayer(randInt(wolfSkill.dmgMin, wolfSkill.dmgMax));
    lines.push('Волк использует «' + wolfSkill.name + '»: ' + heroLabel + ' получает <span class="dmg">' + dealt + ' урона</span>.');
    var reflectDmg = lastPlayerReflect;
    if (reflectDmg > 0) {
      lines.push('<span class="stun">Магический щит бьёт в ответ: волк получает ' + reflectDmg + ' урона.</span>');
    }

    if (wolfSkill.bleedTurns) {
      playerState.bleedTurns = wolfSkill.bleedTurns;
      lines.push('<span class="bleed">Кровотечение: ' + heroLabel + ' теряет HP ещё ' + wolfSkill.bleedTurns + ' хода.</span>');
    }
    if (wolfSkill.disableShieldTurns) {
      playerState.armor = 0;
      playerState.shieldDisabledTurns = wolfSkill.disableShieldTurns;
      renderPlayerBars();
      renderSkillBadges();
      lines.push('<span class="stun">' + heroLabel + ': щит отключён на ' + wolfSkill.disableShieldTurns + ' хода.</span>');
    }
    wolfSkill.remainingCd = wolfSkill.cd;

    // анимация атаки волка: волк подаётся вперёд, на игроке появляется эффект укуса/когтей, игрок откатывается и краснеет
    wolfAttackAnim();
    setTimeout(function () {
      if (wolfSkill.fx === 'bite') {
        spawnImgFx('player-fx-slot', 'assets/effect-bite.png', 'fx-bite');
      } else if (wolfSkill.fx === 'claw') {
        spawnClawFx();
        setTimeout(function () {
          spawnImgFx('player-fx-slot', 'assets/effect-shield-disabled.png', 'fx-shield-break');
        }, 260);
      }
      playerHitAnim();
      if (reflectDmg > 0) {
        setTimeout(function () {
          spawnReflectFx();
          enemyHitAnim(false);
        }, 260);
      }
    }, 140);

    if (!wolfState.alive) {
      setTimeout(function () {
        setDialogue(lines.join(' ') + ' Волк повержен ответным ударом магического щита.');
        battleBusy = false;
      }, 500);
      return;
    }

    if (!playerState.alive) {
      setDialogue(lines.join(' ') + ' ' + heroLabel + ' повержен.');
      battleBusy = false;
      return;
    }

    finishEnemyTurn(lines);
  }

  // выбирает случайный скилл волка из тех, что не на КД
  function pickWolfSkill() {
    var available = wolfBattleData.skills.filter(function (s) { return s.remainingCd === 0; });
    if (!available.length) return null;
    return available[randInt(0, available.length - 1)];
  }

  // общая концовка хода волка: тик статусов игрока и волка, тик всех КД
  function finishEnemyTurn(lines) {
    var heroLabel = chosenHero ? chosenHero.name : 'Герой';
    if (playerState.bleedTurns > 0) {
      var pBleed = damagePlayer(playerState.bleedDmg, true);
      playerState.bleedTurns--;
      lines.push('Кровотечение: ' + heroLabel + ' теряет <span class="dmg">' + pBleed + ' HP</span>.');
      if (!playerState.alive) {
        lines.push(heroLabel + ' истекает кровью и погибает.');
        setDialogue(lines.join(' '));
        battleBusy = false;
        return;
      }
    }
    if (playerState.shieldDisabledTurns > 0) {
      playerState.shieldDisabledTurns--;
      if (playerState.shieldDisabledTurns === 0) {
        lines.push(heroLabel + ': щит снова готов к использованию.');
      }
    }
    if (playerState.dodgeTurns > 0) {
      playerState.dodgeTurns--;
    }
    if (wolfState.armorDisabledTurns > 0) {
      wolfState.armorDisabledTurns--;
    }
    setDialogue(lines.join(' '));
    tickCooldowns();
    tickWolfCooldowns();
    renderSkillBadges();
    battleBusy = false;
  }

  // строит HTML для одной иконки (картинка, если есть ассет, иначе эмодзи-плейсхолдер)
  function iconMarkup(item) {
    if (item.img) {
      return '<img src="' + item.img + '.webp" onerror="this.onerror=null;this.src=\'' + item.img + '.png\';" alt="">';
    }
    return item.icon;
  }

  // ===== ЗАПОЛНЕНИЕ СЦЕНЫ БОЯ РЕАЛЬНЫМИ АССЕТАМИ ГЕРОЯ И ВРАГА =====
  function populateBattleDemo() {
    var data = heroBattleData[chosenHero.id];

    document.getElementById('player-name-label').textContent = chosenHero.name;
    var playerAvatarEl = document.getElementById('player-avatar');
    playerAvatarEl.innerHTML = data.avatarImg ? iconMarkup({ img: data.avatarImg }) : data.avatarIcon;

    var row = document.getElementById('player-skill-row');
    row.innerHTML = '';

    data.skills.forEach(function (s, i) {
      var box = document.createElement('div');
      box.className = 'skill-icon';
      box.setAttribute('data-idx', i);
      box.innerHTML = iconMarkup(s);
      if (s.name) attachSkillInteractions(box, s);
      row.appendChild(box);
    });

    // враг (пока единственный доступный противник — одичавший волк)
    document.querySelector('#battle-demo-screen .battle-bars .unit-name').textContent = wolfBattleData.name;
    var enemyAvatarWrap = document.getElementById('enemy-avatar-wrap');
    var enemyAvatarInner = enemyAvatarWrap.querySelector('.avatar-circle.enemy');
    enemyAvatarInner.innerHTML = wolfBattleData.avatarImg ? iconMarkup({ img: wolfBattleData.avatarImg }) : wolfBattleData.avatarIcon;

    var enemyRow = document.getElementById('enemy-skill-row');
    enemyRow.innerHTML = '';
    wolfBattleData.skills.forEach(function (s, i) {
      var box = document.createElement('div');
      box.className = 'skill-icon';
      box.setAttribute('data-enemy-idx', i);
      box.innerHTML = iconMarkup(s);
      if (s.name) attachEnemySkillTooltip(box, s);
      enemyRow.appendChild(box);
    });
    enemyRow.appendChild(enemyAvatarWrap);

    renderWolfBars();
    renderPlayerBars();
    renderSkillBadges();
    renderEnemySkillBadges();
    setDialogue('Волк напряжённо следит за тобой. Выбери скилл, чтобы начать бой.');
  }

  populateBattleDemo();
</script>

</body>
</html>
